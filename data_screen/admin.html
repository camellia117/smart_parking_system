<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>智慧停车后台管理云平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // 从 LocalStorage 读取登录状态和角色
        const isAuth = localStorage.getItem("system_auth");
        const role = localStorage.getItem("system_role");
        
        // 如果没有登录记录，直接踢回登录页
        if (isAuth !== "true") {
            alert("⛔ 非法访问！请先通过统一身份认证中心登录。");
            window.location.href = "login.html"; 
        }
        
        // 【可选】精细化权限控制：比如这里是 screen.html，可以限制只有 screen 或最高权限的 dev 才能看
        if (role !== 'admin' && role !== 'dev'&& role !== 'screen') {
            alert("⛔ 权限不足：您的账号无权访问此页面！");
            window.location.href = "login.html"; 
        }
        
    </script>
    <style>
        /* 全局与科技感背景 */
        :root { --primary: #00eaff; --bg-dark: #050b14; --panel-bg: rgba(10, 25, 50, 0.7); }
        body { margin: 0; padding: 0; background: var(--bg-dark); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; background-image: radial-gradient(circle at top right, #001d4d 0%, #050b14 100%); }
        
        /* 整体布局：侧边栏 + 主内容区 */
        .app-container { display: flex; height: 100vh; }

        /* 侧边栏设计 */
        .sidebar { width: 260px; background: rgba(5, 15, 30, 0.9); border-right: 1px solid rgba(0,234,255,0.2); backdrop-filter: blur(10px); display: flex; flex-direction: column; padding: 20px 0; z-index: 10; box-shadow: 5px 0 15px rgba(0,0,0,0.5);}
        .logo { text-align: center; font-size: 22px; font-weight: bold; color: var(--primary); margin-bottom: 40px; letter-spacing: 2px; text-shadow: 0 0 10px var(--primary); }
        .nav-item { padding: 15px 30px; cursor: pointer; display: flex; align-items: center; gap: 15px; color: #8cb6f5; transition: all 0.3s ease; border-left: 4px solid transparent; }
        .nav-item:hover, .nav-item.active { background: linear-gradient(90deg, rgba(0,234,255,0.1) 0%, transparent 100%); color: #fff; border-left: 4px solid var(--primary); }
        .nav-item i { font-size: 18px; width: 25px; text-align: center; }

        /* 主内容区 */
        .main-content { flex: 1; padding: 30px; position: relative; overflow-y: auto; }
        
        /* 页面容器（单页应用切换原理） */
        .page { display: none; animation: fadeIn 0.5s ease forwards; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 页面标题 */
        .page-header { border-bottom: 1px solid rgba(0,234,255,0.2); padding-bottom: 15px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end;}
        .page-header h2 { margin: 0; color: #fff; font-weight: 300; letter-spacing: 1px; }

        /* --- 模块1：车位监控地图样式 --- */
        .parking-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; }
        .spot { height: 140px; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 18px; position: relative; overflow: hidden; transition: all 0.3s;}
        .spot.free { border-color: #00ff88; background: rgba(0, 255, 136, 0.05); color: #00ff88; }
        .spot.free:hover { background: rgba(0, 255, 136, 0.2); box-shadow: 0 0 15px rgba(0,255,136,0.3); }
        .spot.occupied { border-color: #ff4683; background: rgba(255, 70, 131, 0.1); color: #ff4683; }
        .spot i { font-size: 30px; margin-bottom: 10px; }
        .car-anim { position: absolute; font-size: 60px; color: rgba(255, 255, 255, 0.8); text-shadow: 0 5px 15px rgba(0,0,0,0.5); }

        /* --- 模块2：数据表格样式 --- */
        .data-table { width: 100%; border-collapse: collapse; background: var(--panel-bg); border-radius: 10px; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5); backdrop-filter: blur(5px);}
        .data-table th, .data-table td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .data-table th { background: rgba(0, 234, 255, 0.1); color: var(--primary); font-weight: bold; letter-spacing: 1px; }
        .data-table tr:hover { background: rgba(255,255,255,0.05); }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-badge.in { background: rgba(0, 255, 136, 0.2); color: #00ff88; border: 1px solid #00ff88; }
        .status-badge.out { background: rgba(140, 182, 245, 0.2); color: #8cb6f5; border: 1px solid #8cb6f5; }
        .page iframe {
            border-radius: 10px;
            background: white; /* 或者 transparent */
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            min-height: 800px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-car-side"></i> 智慧停车云管理
            </div>
            <div class="nav-item active" onclick="switchPage('page-map', this)">
                <i class="fa-solid fa-map-location-dot"></i> 车位全景视图
            </div>
            <div class="nav-item" onclick="switchPage('page-records', this)">
                <i class="fa-solid fa-list-check"></i> 车辆进出流水
            </div>
            <div class="nav-item" onclick="openBigScreen()">
                <i class="fa-solid fa-display"></i> AI 预测大屏 <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 12px; margin-left: auto;"></i>
            </div>
            <div class="nav-item" onclick="switchPage('page-dashboard-v8', this)">
                <i class="fa-solid fa-gauge-high"></i> 智慧停车管控中枢
            </div>
            <div class="nav-item" onclick="switchPage('page-st-1', this)">
                <i class="fa-solid fa-chart-line"></i> 实时监控大盘
            </div>
            <div class="nav-item" onclick="switchPage('page-st-2', this)">
                <i class="fa-solid fa-car-burst"></i> 车辆放行与记录
            </div>
            <div class="nav-item" onclick="switchPage('page-st-3', this)">
                <i class="fa-solid fa-robot"></i> AI预测与财务分析
            </div>
        </div>

        <div class="main-content">
            
            <div id="page-map" class="page active">

                <div class="page-header">
                    <h2><i class="fa-solid fa-map-location-dot"></i> 实时车位状态云图</h2>
                    <div style="color: #8cb6f5;">当前空余: <span id="free-count" style="color:#00ff88; font-size: 24px; font-weight: bold;">--</span> 席</div>
                </div>
                <div class="parking-grid" id="parking-grid">
                    </div>
                </div>

            <div id="page-records" class="page">
                <div class="page-header">
                    <h2><i class="fa-solid fa-list-check"></i> 车辆进出流水大厅</h2>
                    <button style="background: var(--primary); color: #000; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;" onclick="loadRecords()">
                        <i class="fa-solid fa-rotate-right"></i> 刷新数据
                    </button>
                </div>
            <div id="page-st-1" class="page">
                    <iframe src="http://localhost:8503/?menu=1" width="100%" height="850px" frameborder="0" style="border-radius: 10px; background: transparent;"></iframe>
                </div>
                
            <div id="page-st-2" class="page">
                    <iframe src="http://localhost:8503/?menu=2" width="100%" height="850px" frameborder="0" style="border-radius: 10px; background: transparent;"></iframe>
                </div>
                
            <div id="page-st-3" class="page">
                    <iframe src="http://localhost:8503/?menu=3" width="100%" height="850px" frameborder="0" style="border-radius: 10px; background: transparent;"></iframe>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>记录 ID</th>
                            <th>用户 ID</th>
                            <th>入场时间</th>
                            <th>离场时间</th>
                            <th>产生费用 (元)</th>
                            <th>当前状态</th>
                        </tr>
                    </thead>
                    <tbody id="records-tbody">
                        <tr><td colspan="6" style="text-align: center; color: #aaa;">正在同步后端数据...</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="page-dashboard-v8" class="page">
                <div class="page-header">
                    <h2><i class="fa-solid fa-gauge-high"></i> 智慧停车管控中枢 V8</h2>
                </div>
                <iframe src="http://localhost:8503" width="100%" height="800px" frameborder="0" style="border-radius: 10px; background: transparent; box-shadow: 0 0 20px rgba(0,0,0,0.3);"></iframe>
            </div>

        </div>
    </div>

    <script>
        // 1. 单页应用 (SPA) 路由切换逻辑
        function switchPage(pageId, element) {
            // 移除所有激活状态
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            
            // 激活当前选中
            element.classList.add('active');
            document.getElementById(pageId).classList.add('active');

            // 如果切换到了流水页，自动请求后端数据
            if(pageId === 'page-records') {
                loadRecords();
            }
        }

        // 2. 跳转到炫酷大屏
        function openBigScreen() {
            // 在新标签页打开你之前写的 screen.html
            window.open('screen.html', '_blank');
        }

        // 3. 渲染炫酷的 2D 车位地图
        function renderMap() {
            const grid = document.getElementById('parking-grid');
            grid.innerHTML = '';
            let freeCount = 0;
            const totalSpots = 40; // 假设停车场有 40 个车位

            for (let i = 1; i <= totalSpots; i++) {
                // 随机生成占有率 (真实项目中这里应由后端接口返回)
                const isOccupied = Math.random() > 0.6; 
                
                const spotDiv = document.createElement('div');
                spotDiv.className = `spot ${isOccupied ? 'occupied' : 'free'}`;
                
                if (isOccupied) {
                    spotDiv.innerHTML = `
                        <div class="car-anim"><i class="fa-solid fa-car-side"></i></div>
                        <span style="z-index: 2; margin-top: 50px;">A-${i.toString().padStart(3, '0')}</span>
                    `;
                } else {
                    freeCount++;
                    spotDiv.innerHTML = `
                        <i class="fa-solid fa-square-parking"></i>
                        <span>A-${i.toString().padStart(3, '0')}</span>
                    `;
                }
                grid.appendChild(spotDiv);
            }
            document.getElementById('free-count').innerText = freeCount;
        }

        // 4. 调用 FastAPI 后端接口获取真实流水数据
        async function loadRecords() {
            const tbody = document.getElementById('records-tbody');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #00eaff;"><i class="fa-solid fa-spinner fa-spin"></i> 正在连接 FastAPI 核心...</td></tr>';
            
            try {
                // 调用你 backend/main.py 里的 @app.get("/records") 接口
                const response = await fetch('http://127.0.0.1:8000/records');
                const data = await response.json();
                
                tbody.innerHTML = '';
                
                // 倒序排列，让最新的记录在上面，并只取前 20 条展示
                const recentData = data.reverse().slice(0, 20);

                recentData.forEach(record => {
                    const tr = document.createElement('tr');
                    const isLeft = record.leave_time !== null;
                    const statusHtml = isLeft 
                        ? `<span class="status-badge out">已离场</span>` 
                        : `<span class="status-badge in"><i class="fa-solid fa-circle-dot" style="font-size:8px; animation: pulse 1.5s infinite;"></i> 场内停泊</span>`;
                    
                    const fee = record.fee ? `¥${record.fee.toFixed(2)}` : '--';
                    
                    // 格式化时间字符串
                    const formatTime = (timeStr) => {
                        if(!timeStr) return '--';
                        return new Date(timeStr).toLocaleString('zh-CN', {hour12: false});
                    };

                    tr.innerHTML = `
                        <td style="color: #8cb6f5;">#REQ-${record.id}</td>
                        <td><i class="fa-solid fa-user-astronaut"></i> U-${record.user_id}</td>
                        <td>${formatTime(record.enter_time)}</td>
                        <td>${formatTime(record.leave_time)}</td>
                        <td style="color: #ffeb7b; font-weight: bold;">${fee}</td>
                        <td>${statusHtml}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("无法获取数据:", error);
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #ff4683;"><i class="fa-solid fa-triangle-exclamation"></i> 无法连接到后端，请确保 uvicorn backend.main:app --reload 正在运行</td></tr>`;
            }
        }

        // 页面加载完毕后初始化车位图
        window.onload = () => {
            renderMap();
            // 每 10 秒刷新一下车位图，模拟车辆进出的动态感
            setInterval(renderMap, 10000); 
        };
    </script>
</body>
</html>
