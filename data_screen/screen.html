<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧停车全景监控大屏</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #fbfbfd;
            --surface: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --border: #d2d2d7;
            --border-light: rgba(0,0,0,0.05);
            --primary: #1d1d1f;
            --success: #34c759;
            --danger: #e3342f;
            --accent: #0071e3;
            --radius: 16px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }

        .header { height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 0 32px; background: var(--surface); border-bottom: 1px solid var(--border-light); flex-shrink: 0; }
        .header h1 { font-size: 20px; color: var(--text-main); font-weight: 600; letter-spacing: -0.5px; }
        .header .clock { font-size: 14px; color: var(--text-muted); font-weight: 500; font-family: ui-monospace, monospace; }
        .header .btn-back { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 13px; font-weight: 500; }
        .header .btn-back:hover { background: #f5f5f7; }

        .main-container { flex: 1; display: flex; padding: 24px; gap: 24px; }

        .col-left { width: 28%; display: flex; flex-direction: column; gap: 24px; }
        .col-center { width: 44%; display: flex; flex-direction: column; gap: 24px; }
        .col-right { width: 28%; display: flex; flex-direction: column; gap: 24px; }

        .panel { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius); display: flex; flex-direction: column; box-shadow: var(--shadow); flex: 1; min-height: 250px; overflow: hidden; }
        
        .panel-title { padding: 20px 24px 0 24px; font-size: 14px; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .panel-title i { color: var(--text-muted); }

        .panel-content { flex: 1; position: relative; padding: 16px; min-height: 0; }
        .chart { width: 100%; height: 100%; }

        .metrics-bar { flex-shrink: 0; display: flex; gap: 16px; }
        .metric-box { flex: 1; background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
        .m-label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
        .m-value { font-size: 28px; font-weight: 600; color: var(--text-main); letter-spacing: -1px; }

        .radar-panel { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; background: #fbfbfd; border: 1px solid var(--border-light); border-radius: var(--radius); overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,0.01); }
        .radar-map { width: 300px; height: 300px; border-radius: 50%; border: 1px solid var(--border); position: relative; }
        .radar-map::before { content: ''; position: absolute; top: 10%; left: 10%; width: 80%; height: 80%; border-radius: 50%; border: 1px dashed var(--border); }
        .radar-map::after { content: ''; position: absolute; top: 25%; left: 25%; width: 50%; height: 50%; border-radius: 50%; border: 1px solid var(--border-light); }
        
        .radar-line { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: var(--border-light); }
        .radar-line-v { position: absolute; top: 0; left: 50%; width: 1px; height: 100%; background: var(--border-light); }
        
        .car-dot { position: absolute; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 0 4px rgba(0,113,227,0.2); }
        .car-dot.danger { background: var(--danger); box-shadow: 0 0 0 4px rgba(227,52,47,0.2); }

        .device-bar { flex-shrink: 0; display: flex; gap: 16px; align-items: center; justify-content: space-between; background: var(--surface); border-radius: var(--radius); padding: 16px 24px; border: 1px solid var(--border-light); box-shadow: var(--shadow); }
        .dev-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-main); font-weight: 500;}
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }

        .scroll-wrapper { width: 100%; height: 100%; overflow: hidden; position: relative; }
        .scroll-list { list-style: none; animation: scrollUp 20s linear infinite; position: absolute; width: 100%; padding: 0 8px; }
        .scroll-list:hover { animation-play-state: paused; }
        .scroll-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-light); font-size: 13px; }
        .s-plate { font-weight: 600; color: var(--text-main); font-family: monospace; }
        .s-time { color: var(--text-muted); }
        .s-tag { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; background: #f5f5f7; color: var(--text-muted); }
        
        @keyframes scrollUp { 0% { top: 0; } 100% { top: -100%; } }

        @media (max-width: 1024px) {
            body { height: auto; overflow-y: auto; }
            .main-container { flex-direction: column; }
            .col-left, .col-center, .col-right { width: 100%; }
            .panel { min-height: 350px; }
            .metrics-bar { flex-wrap: wrap; }
            .metric-box { min-width: 150px; }
            .radar-panel { min-height: 400px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="btn-back" onclick="window.close()"><i class="fa-solid fa-arrow-left"></i> 返回控制台</button>
        <h1>调度中枢监控视图</h1>
        <div class="clock" id="clock">--</div>
    </div>

    <div class="main-container">
        
        <div class="col-left">
            <div class="panel">
                <div class="panel-title"><i class="fa-solid fa-chart-line"></i> 潮汐预测</div>
                <div class="panel-content"><div id="chart-traffic" class="chart"></div></div>
            </div>
            <div class="panel">
                <div class="panel-title"><i class="fa-solid fa-car"></i> 车辆画像</div>
                <div class="panel-content"><div id="chart-type" class="chart"></div></div>
            </div>
            <div class="panel">
                <div class="panel-title"><i class="fa-solid fa-coins"></i> 营收结构</div>
                <div class="panel-content"><div id="chart-revenue" class="chart"></div></div>
            </div>
        </div>

        <div class="col-center">
            <div class="metrics-bar">
                <div class="metric-box">
                    <div class="m-label">总营收 (元)</div>
                    <div class="m-value" id="val-revenue">0.00</div>
                </div>
                <div class="metric-box">
                    <div class="m-label">今日吞吐 (次)</div>
                    <div class="m-value" id="val-vehicles">0</div>
                </div>
                <div class="metric-box">
                    <div class="m-label">全网空余 (位)</div>
                    <div class="m-value" id="val-spaces">0</div>
                </div>
            </div>

            <div class="radar-panel">
                <div class="radar-map">
                    <div class="radar-line"></div>
                    <div class="radar-line-v"></div>
                    <div class="car-dot" style="top: 20%; left: 30%;"></div>
                    <div class="car-dot" style="top: 50%; left: 20%;"></div>
                    <div class="car-dot danger" style="top: 75%; left: 60%;"></div>
                    <div class="car-dot" style="top: 40%; left: 80%;"></div>
                </div>
            </div>

            <div class="device-bar">
                <div class="dev-item"><div class="status-dot"></div> AI 节点正常</div>
                <div class="dev-item"><div class="status-dot"></div> 边缘硬件在线</div>
                <div class="dev-item"><div class="status-dot"></div> 数据库同步中</div>
            </div>
        </div>

        <div class="col-right">
            <div class="panel">
                <div class="panel-title"><i class="fa-solid fa-signal"></i> 饱和度监控</div>
                <div class="panel-content"><div id="chart-lots" class="chart"></div></div>
            </div>
            <div class="panel">
                <div class="panel-title"><i class="fa-solid fa-gauge-high"></i> 周转利用率</div>
                <div class="panel-content"><div id="chart-util" class="chart"></div></div>
            </div>
            <div class="panel">
                <div class="panel-title"><i class="fa-solid fa-list-ul"></i> 实时流水</div>
                <div class="panel-content">
                    <div class="scroll-wrapper">
                        <ul class="scroll-list" id="realtime-list"></ul>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const API_BASE = 'http://101.132.235.100:8000';

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleString('zh-CN', { hour12: false });
        }, 1000);

        const cTraffic = echarts.init(document.getElementById('chart-traffic'));
        const cType = echarts.init(document.getElementById('chart-type'));
        const cRev = echarts.init(document.getElementById('chart-revenue'));
        const cLots = echarts.init(document.getElementById('chart-lots'));
        const cUtil = echarts.init(document.getElementById('chart-util'));

        window.addEventListener('resize', () => {
            cTraffic.resize(); cType.resize(); cRev.resize(); cLots.resize(); cUtil.resize();
        });

        cType.setOption({
            tooltip: { trigger: 'item', backgroundColor: '#fff', textStyle: { color: '#1d1d1f' }, borderColor: '#d2d2d7' },
            legend: { top: 'bottom', textStyle: { color: '#86868b', fontSize: 10 }, icon: 'circle' },
            color: ['#1d1d1f', '#86868b', '#d2d2d7', '#0071e3'],
            series: [{
                type: 'pie', radius: ['40%', '70%'],
                label: { show: false },
                itemStyle: { borderWidth: 2, borderColor: '#fff' },
                data: [ { value: 45, name: '绿牌' }, { value: 30, name: '月租' }, { value: 20, name: '临停' }, { value: 5, name: '其他' } ]
            }]
        });

        cUtil.setOption({
            series: [{
                type: 'gauge', center: ['50%', '60%'], radius: '90%',
                axisLine: { lineStyle: { width: 8, color: [[0.3, '#f5f5f7'], [0.7, '#d2d2d7'], [1, '#1d1d1f']] } },
                pointer: { itemStyle: { color: '#1d1d1f' } },
                axisTick: { show: false },
                splitLine: { show: false },
                axisLabel: { show: false },
                detail: { valueAnimation: true, formatter: '{value}%', color: '#1d1d1f', fontSize: 24, padding: [20, 0, 0, 0] },
                data: [{ value: 78, name: '综合利用' }],
                title: { color: '#86868b', fontSize: 12, offsetCenter: [0, '80%'] }
            }]
        });

        function renderTraffic(hours, data) {
            cTraffic.setOption({
                tooltip: { trigger: 'axis', backgroundColor: '#fff', borderColor: '#d2d2d7', textStyle: { color: '#1d1d1f' } },
                grid: { left: '5%', right: '5%', bottom: '5%', top: '15%', containLabel: true },
                xAxis: { type: 'category', data: hours, axisLabel: { color: '#86868b', fontSize: 10 }, axisLine: { lineStyle: { color: '#d2d2d7' } } },
                yAxis: { type: 'value', splitLine: { lineStyle: { color: '#f5f5f7' } }, axisLabel: { color: '#86868b', fontSize: 10 } },
                series: [{
                    data: data, type: 'line', smooth: true, symbol: 'none',
                    lineStyle: { width: 2, color: '#1d1d1f' },
                    areaStyle: { color: 'rgba(29, 29, 31, 0.05)' }
                }]
            });
        }

        function renderRevenue() {
            cRev.setOption({
                tooltip: { trigger: 'item', backgroundColor: '#fff', borderColor: '#d2d2d7', textStyle: { color: '#1d1d1f' } },
                grid: { left: '2%', right: '15%', bottom: '5%', top: '5%', containLabel: true },
                xAxis: { type: 'value', show: false },
                yAxis: { type: 'category', data: ['临时费', 'VIP', '充电费', '其他'], axisLabel: { color: '#86868b', fontSize: 10 }, axisLine: { show: false }, axisTick: { show: false } },
                series: [{
                    type: 'bar', barWidth: '30%',
                    data: [4500, 2800, 1050, 300],
                    itemStyle: { borderRadius: [0, 4, 4, 0], color: '#1d1d1f' },
                    label: { show: true, position: 'right', formatter: '¥{c}', color: '#1d1d1f', fontSize: 10 }
                }]
            });
        }

        function renderLots(names, usages) {
            cLots.setOption({
                tooltip: { trigger: 'axis', backgroundColor: '#fff', borderColor: '#d2d2d7', textStyle: { color: '#1d1d1f' } },
                grid: { left: '2%', right: '15%', bottom: '5%', top: '10%', containLabel: true },
                xAxis: { type: 'value', max: 100, splitLine: { show: false }, axisLabel: { show: false } },
                yAxis: { type: 'category', data: names, axisLabel: { color: '#86868b', fontSize: 10 }, axisLine: { show: false }, axisTick: { show: false } },
                series: [{
                    type: 'bar', data: usages, barWidth: '30%',
                    itemStyle: { borderRadius: [0, 4, 4, 0], color: function(p) { return p.value > 85 ? '#e3342f' : '#d2d2d7'; } },
                    label: { show: true, position: 'right', formatter: '{c}%', color: '#1d1d1f', fontSize: 10 }
                }]
            });
        }

        function renderList(records) {
            const ul = document.getElementById('realtime-list');
            ul.innerHTML = '';
            [...records, ...records, ...records].forEach(item => {
                const isOut = item.type === 'out';
                ul.innerHTML += `
                    <li class="scroll-item">
                        <div><i class="fa-solid fa-camera" style="color:var(--text-muted); margin-right:8px;"></i> <span class="s-plate">${item.plate}</span></div>
                        <div class="s-time">${item.time}</div>
                    </li>
                `;
            });
        }

        const mockDb = {
            tHours: Array.from({length:24}, (_,i)=>`${i}:00`),
            tVols: [15, 10, 5, 2, 8, 30, 80, 150, 180, 120, 90, 85, 95, 110, 130, 190, 220, 160, 100, 70, 50, 30, 20, 18],
            lNames: ['A区地下', 'B区露天', 'VIP专区'],
            lUsg: [85, 42, 96],
            recs: [ { plate: '粤B·88888', time: '刚才', type: 'in' }, { plate: '鄂A·66666', time: '1分钟前', type: 'out' }, { plate: '京C·99999', time: '5分钟前', type: 'out' }, { plate: '川A·00000', time: '8分钟前', type: 'in' } ]
        };

        async function fetchAllData() {
            try { const s = await (await fetch(`${API_BASE}/statistics`)).json(); document.getElementById('val-revenue').innerText = s.total_revenue.toFixed(2); document.getElementById('val-vehicles').innerText = s.records; } 
            catch(e) { document.getElementById('val-revenue').innerText = "8,650.00"; document.getElementById('val-vehicles').innerText = "1245"; }

            try { const p = await (await fetch(`${API_BASE}/predict`)).json(); renderTraffic(p.map(x=>x.hour+":00"), p.map(x=>x.predicted_cars)); } 
            catch(e) { renderTraffic(mockDb.tHours, mockDb.tVols); }

            try {
                const lots = await (await fetch(`${API_BASE}/lots`)).json(); let total = 0, names = [], usg = [];
                lots.forEach(l => { total += l.available_spaces; names.push(l.name.substring(0,6)); usg.push(Math.round(((l.total_spaces - l.available_spaces)/l.total_spaces)*100)); });
                document.getElementById('val-spaces').innerText = total; renderLots(names.reverse(), usg.reverse());
            } catch(e) { document.getElementById('val-spaces').innerText = "86"; renderLots(mockDb.lNames.reverse(), mockDb.lUsg.reverse()); }

            try {
                const r = await (await fetch(`${API_BASE}/records`)).json();
                renderList(r.slice(-5).reverse().map(i => ({ plate: `U-${i.user_id} 车辆`, time: new Date(i.enter_time).toLocaleTimeString(), type: i.leave_time ? 'out' : 'in' })));
            } catch(e) { renderList(mockDb.recs); }

            renderRevenue();
        }

        fetchAllData(); setInterval(fetchAllData, 15000);

    </script>
</body>
</html>
