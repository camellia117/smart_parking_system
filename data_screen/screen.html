<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧停车全息监控大屏 - SpaceX Edition</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* 赛博朋克深空配色 */
            --bg-base: #07070b;
            --surface: rgba(10, 15, 25, 0.65);
            --text-main: #e0faff;
            --text-muted: #4a7298;
            --border: rgba(0, 240, 255, 0.2);
            --border-highlight: rgba(0, 240, 255, 0.8);
            --accent: #00f0ff;
            --danger: #ff007b;
            --success: #00ff9d;
            --warning: #ffb800;
            --radius: 8px;
            --shadow-glow: 0 0 20px rgba(0, 240, 255, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* 动态网格背景 */
        body { 
            background-color: var(--bg-base); 
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-main); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display: flex; flex-direction: column; min-height: 100vh;
            overflow: hidden; /* 强制大屏不滚动 */
        }

        /* 顶部星舰导航栏 */
        .header { 
            height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 32px; 
            background: linear-gradient(180deg, rgba(0,240,255,0.1) 0%, transparent 100%); 
            border-bottom: 1px solid var(--border); flex-shrink: 0; 
            box-shadow: 0 4px 30px rgba(0, 240, 255, 0.1);
        }
        .header h1 { font-size: 24px; color: var(--accent); font-weight: 700; letter-spacing: 2px; text-shadow: 0 0 10px var(--accent); }
        .header .clock { font-size: 16px; color: var(--accent); font-weight: 600; font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 8px var(--accent); }
        .header .btn-back { background: rgba(0, 240, 255, 0.1); border: 1px solid var(--accent); color: var(--accent); padding: 8px 16px; border-radius: 4px; cursor: pointer; transition: 0.3s; font-size: 13px; font-weight: 600; text-transform: uppercase; box-shadow: 0 0 10px rgba(0,240,255,0.2) inset; }
        .header .btn-back:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent); }

        .main-container { flex: 1; display: flex; padding: 20px; gap: 20px; }

        .col-left { width: 25%; display: flex; flex-direction: column; gap: 20px; z-index: 2; }
        .col-center { width: 50%; display: flex; flex-direction: column; gap: 20px; z-index: 1; }
        .col-right { width: 25%; display: flex; flex-direction: column; gap: 20px; z-index: 2; }

        /* 全息面板特效 */
        .panel { 
            background: var(--surface); 
            backdrop-filter: blur(10px); 
            border: 1px solid var(--border); 
            border-radius: var(--radius); 
            display: flex; flex-direction: column; 
            box-shadow: var(--shadow-glow); 
            flex: 1; min-height: 220px; overflow: hidden; 
            position: relative;
            animation: panelLoad 1s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        /* 面板四角高亮科技感 */
        .panel::before { content: ''; position: absolute; top: 0; left: 0; width: 20px; height: 2px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .panel::after { content: ''; position: absolute; bottom: 0; right: 0; width: 20px; height: 2px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }

        /* 面板加载动画延迟，营造依次亮起的启动感 */
        .col-left .panel:nth-child(1) { animation-delay: 0.1s; }
        .col-left .panel:nth-child(2) { animation-delay: 0.3s; }
        .col-left .panel:nth-child(3) { animation-delay: 0.5s; }
        .col-right .panel:nth-child(1) { animation-delay: 0.2s; }
        .col-right .panel:nth-child(2) { animation-delay: 0.4s; }
        .col-right .panel:nth-child(3) { animation-delay: 0.6s; }
        .col-center .panel { animation-delay: 0.8s; opacity: 0; transform: scale(0.95); animation: coreLoad 1.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards 0.5s; }

        @keyframes panelLoad { to { opacity: 1; transform: translateY(0); } }
        @keyframes coreLoad { to { opacity: 1; transform: scale(1); } }

        .panel-title { padding: 16px 20px 0 20px; font-size: 15px; font-weight: 600; color: var(--accent); display: flex; align-items: center; gap: 10px; flex-shrink: 0; text-transform: uppercase; letter-spacing: 1px; }
        .panel-title i { color: var(--text-main); text-shadow: 0 0 5px var(--accent); }

        .panel-content { flex: 1; position: relative; padding: 10px; min-height: 0; }
        .chart { width: 100%; height: 100%; }

        /* ================= C位：中央核心反应堆 (饱和度监控) ================= */
        .core-panel {
            border: 2px solid rgba(0, 240, 255, 0.4);
            box-shadow: inset 0 0 50px rgba(0, 240, 255, 0.1), 0 0 30px rgba(0, 240, 255, 0.2);
            background: radial-gradient(circle at center, rgba(0, 240, 255, 0.05) 0%, transparent 70%);
        }
        .core-title {
            justify-content: center; font-size: 20px; text-shadow: 0 0 15px var(--accent); padding-top: 24px;
        }
        /* HUD 准星装饰 */
        .hud-target { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .hud-target::before { content:''; position:absolute; top:20%; left:5%; width:20px; height:20px; border-top:2px solid var(--accent); border-left:2px solid var(--accent); opacity: 0.5; }
        .hud-target::after { content:''; position:absolute; bottom:20%; right:5%; width:20px; height:20px; border-bottom:2px solid var(--accent); border-right:2px solid var(--accent); opacity: 0.5; }

        /* ================= 右上角：战术雷达与数据集成块 ================= */
        .tactical-hub { display: flex; flex-direction: column; gap: 10px; padding: 10px; height: 100%; }
        
        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex-shrink: 0; }
        .metric-box { background: rgba(0,240,255,0.05); border: 1px solid var(--border); border-radius: 6px; padding: 12px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: inset 0 0 10px rgba(0,240,255,0.1); }
        .m-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
        .m-value { font-size: 20px; font-weight: 700; color: var(--accent); text-shadow: 0 0 8px var(--accent); font-family: 'Courier New', Courier, monospace; }

        .radar-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; min-height: 160px; }
        
        /* 动态雷达扫描特效 */
        .radar-map { width: 140px; height: 140px; border-radius: 50%; border: 1px solid var(--accent); position: relative; box-shadow: 0 0 20px rgba(0,240,255,0.2), inset 0 0 20px rgba(0,240,255,0.2); background: rgba(0, 240, 255, 0.02); }
        .radar-map::before { content: ''; position: absolute; top: 15%; left: 15%; width: 70%; height: 70%; border-radius: 50%; border: 1px dashed rgba(0,240,255,0.5); }
        .radar-map::after { content: ''; position: absolute; top: 35%; left: 35%; width: 30%; height: 30%; border-radius: 50%; border: 1px solid rgba(0,240,255,0.3); }
        
        /* 扫描光晕 */
        .radar-scanner { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(from 0deg, transparent 70%, rgba(0,240,255,0.6) 100%); transform-origin: center; animation: radarScan 2s linear infinite; }
        @keyframes radarScan { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .radar-line { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(0,240,255,0.4); }
        .radar-line-v { position: absolute; top: 0; left: 50%; width: 1px; height: 100%; background: rgba(0,240,255,0.4); }
        
        /* 呼吸红点 */
        .car-dot { position: absolute; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 8px var(--accent); animation: pulseDot 1.5s infinite; }
        .car-dot.danger { background: var(--danger); box-shadow: 0 0 10px var(--danger); animation: pulseDanger 1s infinite; }
        @keyframes pulseDot { 0% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0.3; transform: scale(0.8); } }
        @keyframes pulseDanger { 0% { opacity: 0.8; box-shadow: 0 0 10px var(--danger); } 50% { opacity: 1; box-shadow: 0 0 20px var(--danger); } 100% { opacity: 0.8; box-shadow: 0 0 10px var(--danger); } }

        .device-bar { display: flex; justify-content: space-around; background: rgba(0,240,255,0.05); border: 1px solid var(--border); border-radius: 6px; padding: 8px; flex-shrink: 0; }
        .dev-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-main); }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); }

        /* ================= 实时流水动态列表 ================= */
        .scroll-wrapper { width: 100%; height: 100%; overflow: hidden; position: relative; mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); }
        .scroll-list { list-style: none; animation: scrollUp 15s linear infinite; position: absolute; width: 100%; padding: 0 10px; }
        .scroll-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(0,240,255,0.1); font-size: 13px; }
        .s-plate { font-weight: 700; color: var(--accent); font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 5px var(--accent); }
        .s-time { color: var(--text-muted); font-size: 12px; }
        
        @keyframes scrollUp { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }

    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fa-solid fa-satellite-dish"></i> SMART PARKING // AI-OS COMMAND CENTER</h1>
        <div>
            <span class="clock" id="clock" style="margin-right: 24px;">--:--:--</span>
            <button class="btn-back" onclick="window.close()"><i class="fa-solid fa-power-off"></i> 脱离系统</button>
        </div>
    </div>

    <div class="main-container">
        
        <div class="col-left">
            <div class="panel">
                <div class="panel-title"><i class="fa-solid fa-wave-square"></i> 神经网络潮汐推演</div>
                <div class="panel-content"><div id="chart-traffic" class="chart"></div></div>
            </div>
            <div class="panel">
                <div class="panel-title"><i class="fa-solid fa-fingerprint"></i> 目标车辆特征画像</div>
                <div class="panel-content"><div id="chart-type" class="chart"></div></div>
            </div>
            <div class="panel">
                <div class="panel-title"><i class="fa-solid fa-money-bill-transfer"></i> 财务矩阵实时截流</div>
                <div class="panel-content"><div id="chart-revenue" class="chart"></div></div>
            </div>
        </div>

        <div class="col-center">
            <div class="panel core-panel" style="flex: 1;">
                <div class="hud-target"></div>
                <div class="panel-title core-title"><i class="fa-solid fa-globe"></i> 城市资产孪生 · 核心负荷监控</div>
                <div class="panel-content"><div id="chart-lots" class="chart"></div></div>
            </div>
        </div>

        <div class="col-right">
            <div class="panel" style="min-height: 280px;">
                <div class="panel-title"><i class="fa-solid fa-crosshairs"></i> 全局战术雷达监控</div>
                <div class="panel-content tactical-hub">
                    <div class="metrics-grid">
                        <div class="metric-box"><div class="m-label">实时营收</div><div class="m-value" id="val-revenue">0.00</div></div>
                        <div class="metric-box"><div class="m-label">矩阵吞吐</div><div class="m-value" id="val-vehicles" style="color: var(--success); text-shadow: 0 0 8px var(--success);">0</div></div>
                        <div class="metric-box"><div class="m-label">全网空余</div><div class="m-value" id="val-spaces">0</div></div>
                    </div>
                    
                    <div class="radar-wrapper">
                        <div class="radar-map">
                            <div class="radar-scanner"></div>
                            <div class="radar-line"></div>
                            <div class="radar-line-v"></div>
                            <div class="car-dot" style="top: 20%; left: 30%;"></div>
                            <div class="car-dot" style="top: 60%; left: 20%; animation-delay: 0.3s;"></div>
                            <div class="car-dot danger" style="top: 75%; left: 60%;"></div>
                            <div class="car-dot" style="top: 40%; left: 80%; animation-delay: 0.7s;"></div>
                        </div>
                    </div>

                    <div class="device-bar">
                        <div class="dev-item"><div class="status-dot"></div> AI 引擎运行</div>
                        <div class="dev-item"><div class="status-dot"></div> 边缘硬件上线</div>
                        <div class="dev-item"><div class="status-dot" style="background:var(--warning); box-shadow: 0 0 8px var(--warning);"></div> 链路同步</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title"><i class="fa-solid fa-gauge-high"></i> 资产周转效能评估</div>
                <div class="panel-content"><div id="chart-util" class="chart"></div></div>
            </div>
            <div class="panel">
                <div class="panel-title"><i class="fa-solid fa-terminal"></i> 边缘节点实时捕获</div>
                <div class="panel-content">
                    <div class="scroll-wrapper">
                        <ul class="scroll-list" id="realtime-list"></ul>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const API_BASE = 'http://101.132.235.100:8000';

        // 科幻数字时钟
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleString('zh-CN', { hour12: false }) + '.' + now.getMilliseconds().toString().padStart(3, '0');
        }, 50);

        const cTraffic = echarts.init(document.getElementById('chart-traffic'));
        const cType = echarts.init(document.getElementById('chart-type'));
        const cRev = echarts.init(document.getElementById('chart-revenue'));
        const cLots = echarts.init(document.getElementById('chart-lots')); // 这个现在在C位
        const cUtil = echarts.init(document.getElementById('chart-util'));

        window.addEventListener('resize', () => {
            cTraffic.resize(); cType.resize(); cRev.resize(); cLots.resize(); cUtil.resize();
        });

        // ================= 暗黑赛博朋克风格图表配置 =================

        // 1. 车辆画像 (环形图发光)
        cType.setOption({
            tooltip: { trigger: 'item', backgroundColor: 'rgba(10,15,25,0.9)', textStyle: { color: '#00f0ff' }, borderColor: '#00f0ff' },
            legend: { top: 'bottom', textStyle: { color: '#8B9BB4', fontSize: 10 }, icon: 'circle' },
            color: ['#00f0ff', '#ff007b', '#00ff9d', '#ffb800'],
            series: [{
                type: 'pie', radius: ['45%', '70%'],
                itemStyle: { borderWidth: 2, borderColor: '#07070b', shadowBlur: 10, shadowColor: 'rgba(0, 240, 255, 0.5)' },
                label: { show: false },
                data: [ { value: 45, name: '新能源识别' }, { value: 30, name: '月租白名单' }, { value: 20, name: '临停客流' }, { value: 5, name: '特殊车辆' } ]
            }]
        });

        // 2. 周转效能 (仪表盘荧光)
        cUtil.setOption({
            series: [{
                type: 'gauge', center: ['50%', '60%'], radius: '95%',
                axisLine: { lineStyle: { width: 10, color: [[0.3, '#00ff9d'], [0.7, '#00f0ff'], [1, '#ff007b']], shadowBlur: 10, shadowColor: 'rgba(255, 255, 255, 0.2)' } },
                pointer: { itemStyle: { color: '#00f0ff', shadowBlur: 10, shadowColor: '#00f0ff' } },
                axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false },
                detail: { valueAnimation: true, formatter: '{value}%', color: '#00f0ff', fontSize: 28, textShadow: '0 0 10px #00f0ff', padding: [20, 0, 0, 0] },
                data: [{ value: 84, name: 'AI综合评估' }],
                title: { color: '#8B9BB4', fontSize: 12, offsetCenter: [0, '80%'] }
            }]
        });

        // 3. 潮汐预测 (发光激光线)
        function renderTraffic(hours, data) {
            cTraffic.setOption({
                tooltip: { trigger: 'axis', backgroundColor: 'rgba(10,15,25,0.9)', borderColor: '#00f0ff', textStyle: { color: '#00f0ff' } },
                grid: { left: '3%', right: '5%', bottom: '5%', top: '15%', containLabel: true },
                xAxis: { type: 'category', data: hours, axisLabel: { color: '#8B9BB4', fontSize: 10 }, axisLine: { lineStyle: { color: 'rgba(0,240,255,0.2)' } } },
                yAxis: { type: 'value', splitLine: { lineStyle: { color: 'rgba(0,240,255,0.05)' } }, axisLabel: { color: '#8B9BB4', fontSize: 10 } },
                series: [{
                    data: data, type: 'line', smooth: true, symbol: 'circle', symbolSize: 6,
                    itemStyle: { color: '#00f0ff', shadowBlur: 10, shadowColor: '#00f0ff' },
                    lineStyle: { width: 3, color: '#00f0ff', shadowBlur: 10, shadowColor: '#00f0ff' },
                    areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{offset: 0, color: 'rgba(0,240,255,0.3)'}, {offset: 1, color: 'rgba(0,240,255,0)'}]) }
                }]
            });
        }

        // 4. 营收结构 (霓虹柱状图)
        function renderRevenue() {
            cRev.setOption({
                tooltip: { trigger: 'item', backgroundColor: 'rgba(10,15,25,0.9)', borderColor: '#00ff9d', textStyle: { color: '#00ff9d' } },
                grid: { left: '2%', right: '15%', bottom: '5%', top: '5%', containLabel: true },
                xAxis: { type: 'value', show: false },
                yAxis: { type: 'category', data: ['临停流', 'VIP权', '超充站', '其他源'], axisLabel: { color: '#8B9BB4', fontSize: 10 }, axisLine: { show: false }, axisTick: { show: false } },
                series: [{
                    type: 'bar', barWidth: '35%', data: [4500, 2800, 1050, 300],
                    itemStyle: { borderRadius: [0, 4, 4, 0], color: new echarts.graphic.LinearGradient(1, 0, 0, 0, [{offset: 0, color: '#00ff9d'}, {offset: 1, color: 'rgba(0,255,157,0.1)'}]), shadowBlur: 10, shadowColor: 'rgba(0,255,157,0.5)' },
                    label: { show: true, position: 'right', formatter: '¥{c}', color: '#00ff9d', fontSize: 10, textShadow: '0 0 5px #00ff9d' }
                }]
            });
        }

        // 5. C位核心：饱和度监控 (3D荧光柱体效果)
        function renderLots(names, usages) {
            cLots.setOption({
                tooltip: { trigger: 'axis', backgroundColor: 'rgba(10,15,25,0.9)', borderColor: '#00f0ff', textStyle: { color: '#00f0ff' } },
                grid: { left: '3%', right: '3%', bottom: '8%', top: '15%', containLabel: true },
                xAxis: { type: 'category', data: names, axisLabel: { color: '#8B9BB4', fontSize: 12, interval: 0, rotate: 15 }, axisLine: { lineStyle: { color: 'rgba(0,240,255,0.3)' } }, axisTick: {show:false} },
                yAxis: { type: 'value', max: 100, splitLine: { lineStyle: { color: 'rgba(0,240,255,0.1)', type: 'dashed' } }, axisLabel: { color: '#8B9BB4' } },
                series: [{
                    type: 'bar', data: usages, barWidth: '40%',
                    itemStyle: { 
                        borderRadius: [6, 6, 0, 0], 
                        color: function(p) { 
                            if(p.value > 85) return new echarts.graphic.LinearGradient(0, 0, 0, 1, [{offset: 0, color: '#ff007b'}, {offset: 1, color: 'rgba(255,0,123,0.1)'}]);
                            return new echarts.graphic.LinearGradient(0, 0, 0, 1, [{offset: 0, color: '#00f0ff'}, {offset: 1, color: 'rgba(0,240,255,0.1)'}]);
                        },
                        shadowBlur: 15,
                        shadowColor: function(p) { return p.value > 85 ? 'rgba(255,0,123,0.8)' : 'rgba(0,240,255,0.8)'; }
                    },
                    label: { show: true, position: 'top', formatter: '{c}%', color: '#fff', textShadow: '0 0 5px #00f0ff', fontSize: 14 }
                }]
            });
        }

        // 6. 实时流水无缝滚动
        function renderList(records) {
            const ul = document.getElementById('realtime-list');
            ul.innerHTML = '';
            // 复制两遍实现完美无缝循环
            [...records, ...records].forEach(item => {
                const color = item.type === 'out' ? 'var(--warning)' : 'var(--accent)';
                ul.innerHTML += `
                    <li class="scroll-item">
                        <div><i class="fa-solid fa-crosshairs" style="color:${color}; margin-right:8px; animation: pulseDot 2s infinite;"></i> <span class="s-plate">${item.plate}</span></div>
                        <div class="s-time">${item.time} | ${item.type==='out'?'驶离':'接入'}</div>
                    </li>
                `;
            });
        }

        const mockDb = {
            tHours: Array.from({length:24}, (_,i)=>`${i}:00`),
            tVols: [15, 10, 5, 2, 8, 30, 80, 150, 180, 120, 90, 85, 95, 110, 130, 190, 220, 160, 100, 70, 50, 30, 20, 18],
            lNames: ['上海中心', '环球金融', '金茂大厦', '国金中心', '正大广场', '陆家嘴'],
            lUsg: [92, 78, 65, 88, 45, 95],
            recs: [ { plate: '沪A·D8888', time: '刚才', type: 'in' }, { plate: '沪C·66666', time: '1分钟前', type: 'out' }, { plate: '粤B·99999', time: '5分钟前', type: 'out' }, { plate: '京A·00000', time: '8分钟前', type: 'in' }, { plate: '苏E·12345', time: '10分钟前', type: 'in' } ]
        };

        async function fetchAllData() {
            try { const s = await (await fetch(`${API_BASE}/statistics`)).json(); document.getElementById('val-revenue').innerText = s.total_revenue.toFixed(2); document.getElementById('val-vehicles').innerText = s.records; } 
            catch(e) { document.getElementById('val-revenue').innerText = "18,650.00"; document.getElementById('val-vehicles').innerText = "3,245"; }

            try { const p = await (await fetch(`${API_BASE}/predict`)).json(); renderTraffic(p.map(x=>x.hour+":00"), p.map(x=>x.predicted_cars)); } 
            catch(e) { renderTraffic(mockDb.tHours, mockDb.tVols); }

            try {
                const lots = await (await fetch(`${API_BASE}/lots`)).json(); let total = 0, names = [], usg = [];
                lots.forEach(l => { total += l.available_spaces; names.push(l.name.substring(0,6)); usg.push(Math.round(((l.total_spaces - l.available_spaces)/l.total_spaces)*100)); });
                document.getElementById('val-spaces').innerText = total; renderLots(names.reverse(), usg.reverse());
            } catch(e) { document.getElementById('val-spaces').innerText = "1,086"; renderLots(mockDb.lNames, mockDb.lUsg); }

            try {
                const r = await (await fetch(`${API_BASE}/records`)).json();
                renderList(r.slice(-8).reverse().map(i => ({ plate: `U-${i.user_id} NODE`, time: new Date(i.enter_time).toLocaleTimeString(), type: i.leave_time ? 'out' : 'in' })));
            } catch(e) { renderList(mockDb.recs); }

            renderRevenue();
        }

        // 初次加载与定时刷新
        fetchAllData(); 
        setInterval(fetchAllData, 15000);

    </script>
</body>
</html>
