<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>AI 智慧停车云控平台</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // 从 LocalStorage 读取登录状态和角色
        const isAuth = localStorage.getItem("system_auth");
        const role = localStorage.getItem("system_role");
        
        // 如果没有登录记录，直接踢回登录页
        if (isAuth !== "true") {
            alert("⛔ 非法访问！请先通过统一身份认证中心登录。");
            window.location.href = "login.html"; 
        }
        
        // 【可选】精细化权限控制：比如这里是 screen.html，可以限制只有 screen 或最高权限的 dev 才能看
        // 如果你在改 admin.html，就把下面的 'screen' 换成 'admin'
        if (role !== 'screen' && role !== 'dev') {
            alert("⛔ 权限不足：您的账号无权访问此页面！");
            window.location.href = "login.html"; 
        }
    </script>
    <style>
        body { margin: 0; background: #000510; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* 粒子背景层 */
        #particles-js {
            position: absolute; width: 100%; height: 100%;
            background-image: radial-gradient(circle, #001d4d 0%, #000510 100%);
            z-index: 1;
        }

        /* 玻璃拟态容器 */
        .main-content { position: relative; z-index: 2; height: 100vh; display: flex; flex-direction: column; }
        
        .header {
            height: 70px; background: rgba(0, 234, 255, 0.05);
            backdrop-filter: blur(10px); border-bottom: 2px solid #00eaff33;
            display: flex; justify-content: space-between; align-items: center; padding: 0 50px;
        }

        .header h1 { 
            background: linear-gradient(to right, #00eaff, #008cff);
            -webkit-background-clip: text; color: transparent;
            font-size: 28px; letter-spacing: 5px; text-transform: uppercase;
        }

        .container { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 20px; padding: 20px; flex: 1; }
        
        .panel {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(0, 234, 255, 0.1);
            border-radius: 15px; padding: 15px; display: flex; flex-direction: column;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .panel-title { color: #00eaff; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; }
        .panel-title::before { content: ""; width: 4px; height: 16px; background: #00eaff; margin-right: 8px; }

        .chart { flex: 1; width: 100%; }

        /* 数字跳动效果 */
        .big-num { font-family: 'Orbitron', sans-serif; font-size: 42px; color: #00eaff; text-shadow: 0 0 15px #00eaff; }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <div class="main-content">
        <div class="header">
            <h1>SMART PARKING AI-OS</h1>
            <div id="time" style="color: #8cb6f5; font-family: monospace;"></div>
        </div>

        <div class="container">
            <div class="col">
                <div class="panel">
                    <div class="panel-title">实时入场率</div>
                    <div id="gaugeChart" class="chart"></div>
                </div>
                <div class="panel">
                    <div class="panel-title">AI 识别流</div>
                    <div style="background: #000; height: 150px; border-radius: 10px; position: relative; overflow: hidden;">
                        <div style="width:100%; height:2px; background:#00eaff; position:absolute; animation: scan 2s infinite;"></div>
                        <p style="font-size: 10px; color: #0f0; padding: 10px; font-family: monospace;">
                            [AI SCANNING...]<br>
                            PLATE: 粤B·88888 (98.2%)<br>
                            STATUS: ENTEREDING...
                        </p>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">AI 流量神经网络预测 (未来24h)</div>
                <div id="mainChart" class="chart"></div>
            </div>

            <div class="col">
                <div class="panel">
                    <div class="panel-title">今日总营收</div>
                    <div class="big-num" id="val-revenue">¥0.00</div>
                </div>
                <div id="pieChart" class="panel chart"></div>
            </div>
        </div>
    </div>

    <script>
        // 初始化粒子背景
        particlesJS('particles-js', {
            particles: {
                number: { value: 80 },
                color: { value: '#00eaff' },
                shape: { type: 'circle' },
                opacity: { value: 0.5 },
                size: { value: 3 },
                line_linked: { enable: true, distance: 150, color: '#00eaff', opacity: 0.2, width: 1 },
                move: { enable: true, speed: 2 }
            }
        });

        // 模拟扫描线动画
        const style = document.createElement('style');
        style.innerHTML = `@keyframes scan { 0% {top: 0;} 100% {top: 100%;} }`;
        document.head.appendChild(style);

        // 初始化图表
        const mainChart = echarts.init(document.getElementById('mainChart'));
        
        async function updateData() {
            try {
                // 调用你的 FastAPI 接口
                const res = await fetch("http://127.0.0.1:8000/predict");
                const data = await res.json();
                
                mainChart.setOption({
                    tooltip: { trigger: 'axis' },
                    xAxis: { type: 'category', data: data.map(i=>i.hour + ":00"), axisLabel: {color: '#8cb6f5'} },
                    yAxis: { type: 'value', splitLine: {lineStyle: {color: '#112233'}} },
                    series: [{
                        name: '预测车辆',
                        data: data.map(i=>i.predicted_cars),
                        type: 'line', smooth: true,
                        symbol: 'none',
                        lineStyle: { width: 4, color: '#00eaff' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0,0,0,1, [
                                {offset: 0, color: 'rgba(0, 234, 255, 0.3)'},
                                {offset: 1, color: 'transparent'}
                            ])
                        }
                    }]
                });
            } catch(e) { console.log("Backend not ready..."); }
        }

        setInterval(updateData, 5000);
        updateData();
        
        // 更新时间
        setInterval(() => {
            document.getElementById('time').innerText = new Date().toLocaleString();
        }, 1000);
    </script>
</body>
</html>
