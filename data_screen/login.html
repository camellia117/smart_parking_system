<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>智慧停车系统 - 统一身份认证</title>
    <style>
        body { margin: 0; padding: 0; background: #050b14; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        /* 动态背景星空/光晕 */
        .bg-glow { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(0, 234, 255, 0.1) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 0; animation: pulse 4s infinite alternate; }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 100% { transform: translate(-50%, -50%) scale(1.2); } }

        /* 登录框玻璃拟态 */
        .login-box { position: relative; z-index: 1; background: rgba(10, 25, 50, 0.6); border: 1px solid rgba(0, 234, 255, 0.3); border-radius: 15px; padding: 40px; width: 350px; box-shadow: 0 0 30px rgba(0, 234, 255, 0.1); backdrop-filter: blur(10px); text-align: center; }
        .login-box h2 { color: #00eaff; letter-spacing: 2px; margin-bottom: 30px; }
        
        .input-group { margin-bottom: 25px; text-align: left; }
        .input-group label { display: block; color: #8cb6f5; font-size: 14px; margin-bottom: 8px; }
        .input-group input { width: 90%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid #333; color: #fff; border-radius: 5px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #00eaff; box-shadow: 0 0 10px rgba(0,234,255,0.2); }

        .btn-login { width: 100%; padding: 12px; background: linear-gradient(90deg, #008cff, #00eaff); border: none; color: #000; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; margin-top: 10px;}
        .btn-login:hover { box-shadow: 0 0 20px rgba(0,234,255,0.5); transform: translateY(-2px); }

        #error-msg { color: #ff4683; font-size: 14px; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="login-box">
        <h2>AI-PARKING OS</h2>
        <div class="input-group">
            <label>账号 (Username)</label>
            <input type="text" id="username" placeholder="请输入系统分配账号">
        </div>
        <div class="input-group">
            <label>密码 (Password)</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button class="btn-login" onclick="doLogin()">登 录 进 入</button>
        <div id="error-msg">账号或密码错误！</div>
    </div>

    <script>
        async function doLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const err = document.getElementById('error-msg');

            try {
                const res = await fetch('http://127.0.0.1:8000/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                
                const data = await res.json();

                if (data.success) {
                    err.style.display = 'none';
                    
                    // 【新增代码】：登录成功后，将身份信息存入浏览器的 LocalStorage
                    localStorage.setItem("system_auth", "true");
                    localStorage.setItem("system_role", data.role);
                    localStorage.setItem("system_username", u); 

                    // 核心权限路由逻辑
                    if (data.role === 'screen') {
                        window.location.href = 'screen.html';
                    } else if (data.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else if (data.role === 'dev') {
                        // 【修改代码】：开发者跳转到 Streamlit 时，在 URL 中加上一个简单的授权 Token
                        window.location.href = 'http://localhost:8501/?auth_token=dev_granted'; 
                    }
                } else {
                    err.innerText = data.message;
                    err.style.display = 'block';
                }
            } catch(e) {
                err.innerText = "网络请求失败，请检查后端是否启动";
                err.style.display = 'block';
            }
}
    </script>
</body>
</html>
